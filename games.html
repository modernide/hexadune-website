<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hexadune</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background-color: #dcb37b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none;
            touch-action: none;
        }

        #game-window { width: 100%; height: 100%; cursor: grab; }
        #game-window:active { cursor: grabbing; }
        #map-container { position: absolute; transform-origin: 0 0; }
        
        .hex-polygon { stroke: #b88d54; stroke-width: 2; transition: fill 0.3s, stroke 0.2s; }
        .terrain-sand { fill: #e1c699; }
        .terrain-cactus { fill: #d2b48c; }
        .terrain-tower { fill: #e8cc9b; stroke: #8a6a3d; stroke-width: 4; }
        
        .hex-text { font-size: 22px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

        /* --- IMMERSIVE DESERT HUB HUD OVERLAYS --- */
        #hub-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box;
        }

        .hub-header {
            display: flex; justify-content: space-between; align-items: center; width: 100%; pointer-events: auto;
        }

        .hub-title {
            font-size: 2.2em; color: #24190e; font-weight: 900; letter-spacing: 3px;
            text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff; margin: 0;
        }

        .user-badge {
            background: rgba(40, 26, 13, 0.9); border: 2px solid #b88d54; color: #fff;
            padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.9em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px;
        }

        .logout-link { color: #ff7675; cursor: pointer; text-decoration: underline; font-size: 0.85em; }

        .hub-content-container {
            display: flex; width: 100%; gap: 20px; flex: 1; margin: 20px 0; min-height: 0;
        }

        .hub-panel {
            background: rgba(40, 26, 13, 0.88); border: 3px solid #b88d54; border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); padding: 20px; color: #fff;
            display: flex; flex-direction: column; pointer-events: auto; backdrop-filter: blur(5px);
        }

        .panel-left { flex: 2; min-height: 0; }
        .panel-right { flex: 1; justify-content: flex-start; gap: 15px; }

        .panel-heading {
            font-size: 1.2em; text-transform: uppercase; letter-spacing: 1.5px; color: #e1c699;
            margin: 0 0 15px 0; border-bottom: 2px solid #5c4322; padding-bottom: 6px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* --- LOBBY TABLE & INTERACTIVES --- */
        .lobby-scroll-area { overflow-y: auto; flex: 1; margin-bottom: 10px; padding-right: 5px; }
        
        .lobby-row {
            background: rgba(255,255,255,0.04); border: 1px solid #5c4322; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between;
            align-items: center; transition: background 0.2s;
        }
        .lobby-row:hover { background: rgba(255,255,255,0.08); border-color: #b88d54; }

        .room-meta { display: flex; flex-direction: column; gap: 2px; }
        .room-name { font-weight: bold; color: #fff; font-size: 1em; }
        .room-players { font-size: 0.8em; color: #a4b0be; }

        .form-input {
            background: rgba(0,0,0,0.4); border: 2px solid #5c4322; border-radius: 8px;
            color: #fff; padding: 10px; font-size: 0.9em; box-sizing: border-box; width: 100%;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #b88d54; outline: none; }

        .form-select {
            background: rgba(0,0,0,0.4); border: 2px solid #5c4322; border-radius: 8px;
            color: #fff; padding: 10px; font-size: 0.9em; box-sizing: border-box; width: 100%;
            cursor: pointer;
        }

        /* --- CUSTOM FORM DESIGN ELEMENTS --- */
        .color-picker-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 5px;
        }
        .color-swatch {
            aspect-ratio: 1; border-radius: 6px; cursor: pointer; border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .color-swatch:hover { transform: scale(1.08); }
        .color-swatch.selected { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 8px rgba(255,255,255,0.5); }

        .action-btn {
            background: #b88d54; color: #fff; border: none; padding: 10px 18px;
            font-weight: bold; font-size: 0.9em; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.2s, transform 0.1s;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2); text-align: center; text-decoration: none;
        }
        .action-btn:hover { background: #d2a46d; }
        .action-btn:active { transform: scale(0.98); }
        
        .action-btn-sm { padding: 6px 12px; font-size: 0.8em; border-radius: 6px; }
        .action-btn-accent { background: #2ed573; }
        .action-btn-accent:hover { background: #26af5f; }

        /* SCROLLBAR CUSTOMIZATION */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #5c4322; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #b88d54; }

        @media (max-width: 768px) {
            .hub-content-container { flex-direction: column; }
            .panel-right { flex: none; }
        }
    </style>
</head>
<body>

    <div id="hub-overlay">
        <header class="hub-header">
            <h1 class="hub-title">HEXADUNE</h1>
            <div class="user-badge">
                <span id="user-display-name">Loading Profile...</span>
                <span class="logout-link" onclick="handleLogout()">Sign Out</span>
            </div>
        </header>

        <main class="hub-content-container">
            <section class="hub-panel panel-left">
                <h2 class="panel-heading">
                    Active Deployment Rooms
                    <button class="action-btn action-btn-sm" onclick="fetchActiveLobbies()">Refresh Sync</button>
                </h2>
                <div class="lobby-scroll-area" id="lobby-list-container">
                    <p style="color: #a4b0be; font-style: italic;">Querying active server frequencies...</p>
                </div>
            </section>

            <section class="hub-panel panel-right">
                <h2 class="panel-heading">Initialize New Lobby</h2>
                
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label style="font-size: 0.8em; color: #a4b0be; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 4px;">Room Identifier</label>
                        <input type="text" id="new-room-id" class="form-input" placeholder="e.g., alpha-dune-sector">
                    </div>

                    <div>
                        <label style="font-size: 0.8em; color: #a4b0be; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 4px;">Room Privacy Visibility</label>
                        <select id="new-room-visibility" class="form-select">
                            <option value="public">Public Matchmaking Room</option>
                            <option value="private">Private Unlisted Room</option>
                        </select>
                    </div>

                    <div>
                        <label style="font-size: 0.8em; color: #a4b0be; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 4px;">Tactical Deployment Color</label>
                        <div class="color-picker-grid" id="color-picker-grid">
                            </div>
                    </div>

                    <button class="action-btn action-btn-accent" style="margin-top: 10px;" onclick="handleCreateLobby()">Establish Deployment</button>
                </div>
            </section>
        </main>
    </div>

    <div id="game-window">
        <div id="map-container">
            <svg id="background-grid" style="overflow: visible; opacity: 0.15; pointer-events: none;"></svg>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:3000/v1' 
            : 'https://hexadune.onrender.com/v1';

        const hexColors = ['#3b82f6', '#ef4444', '#10b981', '#8b5cf6', '#f59e0b', '#ec4899'];
        let activeSelectedColor = localStorage.getItem('hexadune_player_color') || '#3b82f6';

        const colorGrid = document.getElementById('color-picker-grid');
        hexColors.forEach(color => {
            const swatch = document.createElement('div');
            swatch.classList.add('color-swatch');
            swatch.style.backgroundColor = color;
            if (color === activeSelectedColor) swatch.classList.add('selected');
            
            swatch.addEventListener('click', () => {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                swatch.classList.add('selected');
                activeSelectedColor = color;
                localStorage.setItem('hexadune_player_color', color);
                document.cookie = `hexadune_player_color=${encodeURIComponent(color)}; max-age=86400; path=/`;
            });
            colorGrid.appendChild(swatch);
        });

        async function fetchActiveLobbies() {
            const container = document.getElementById('lobby-list-container');
            try {
                const res = await fetch(`${API_URL}/games`);
                const data = await res.json();
                
                if (!data.success || !data.games || data.games.length === 0) {
                    container.innerHTML = `<p style="color: #a4b0be; font-style: italic; text-align: center; margin-top: 20px;">No public active deployment frequencies mapped.</p>`;
                    return;
                }

                container.innerHTML = '';
                data.games.forEach(game => {
                    const row = document.createElement('div');
                    row.classList.add('lobby-row');

                    const pCount = game.players ? game.players.length : 0;
                    row.innerHTML = `
                        <div class="room-meta">
                            <span class="room-name">${game.gameId}</span>
                            <span class="room-players">${pCount} Active Operational Entity Signature${pCount !== 1 ? 's' : ''}</span>
                        </div>
                        <button class="action-btn action-btn-sm" onclick="joinGameRoom('${game.gameId}', '${game.visibility}')">Deploy</button>
                    `;
                    container.appendChild(row);
                });
            } catch (err) {
                container.innerHTML = `<p style="color: #ff7675; font-style: italic; text-align: center; margin-top: 20px;">Link failure during active lobby array parsing.</p>`;
            }
        }

        function joinGameRoom(gameId, visibility) {
            window.location.href = `./play.html?gameId=${encodeURIComponent(gameId)}&visibility=${encodeURIComponent(visibility)}`;
        }

        async function handleCreateLobby() {
            const roomIdInput = document.getElementById('new-room-id').value.trim();
            const visibility = document.getElementById('new-room-visibility').value;

            if (!roomIdInput) {
                alert("Provide a valid alphanumeric sector deployment configuration identifier.");
                return;
            }

            const formattedRoomId = roomIdInput.toLowerCase().replace(/[^a-z0-9-_]/g, '-');

            localStorage.setItem('hexadune_player_color', activeSelectedColor);
            document.cookie = `hexadune_player_color=${encodeURIComponent(activeSelectedColor)}; max-age=86400; path=/`;

            joinGameRoom(formattedRoomId, visibility);
        }

        const bgGrid = document.getElementById('background-grid');
        const HEX_SIZE = 55;
        const hexPoints = [];
        for (let i = 0; i < 6; i++) {
            const angle = Math.PI / 180 * (60 * i - 30);
            hexPoints.push(`${HEX_SIZE * Math.cos(angle)},${HEX_SIZE * Math.sin(angle)}`);
        }
        const polyPointsStr = hexPoints.join(' ');

        function renderBackgroundGrid() {
            bgGrid.innerHTML = '';
            const radius = 6;
            for (let q = -radius; q <= radius; q++) {
                for (let r = -radius; r <= radius; r++) {
                    if (Math.abs(q + r) > radius) continue;
                    const x = HEX_SIZE * Math.sqrt(3) * (q + r / 2);
                    const y = HEX_SIZE * 3 / 2 * r;

                    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    poly.setAttribute('points', polyPointsStr);
                    poly.setAttribute('transform', `translate(${x}, ${y})`);
                    poly.classList.add('hex-polygon', 'terrain-sand');
                    bgGrid.appendChild(poly);
                }
            }
        }
        renderBackgroundGrid();

        const mapContainer = document.getElementById('map-container');
        let currentTranslateX = window.innerWidth / 2;
        let currentTranslateY = window.innerHeight / 2;
        function updateTransform() { mapContainer.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px) scale(0.65)`; }
        updateTransform();

        window.addEventListener('resize', () => {
            currentTranslateX = window.innerWidth / 2;
            currentTranslateY = window.innerHeight / 2;
            updateTransform();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyCJLvQXWf21el_qFGubIqWBBWmJIQREZc4",
            authDomain: "hexadune.firebaseapp.com",
            projectId: "hexadune",
            storageBucket: "hexadune.firebasestorage.app",
            messagingSenderId: "1044415457830",
            appId: "1:1044415457830:web:97a4a9820b2f880d1f94e7",
            measurementId: "G-N451F03F5J"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function handleLogout() {
            auth.signOut().then(() => {
                window.location.href = "./index.html";
            }).catch((error) => {
                console.error("Logout Error:", error);
            });
        }

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "./index.html";
            } else {
                document.getElementById('user-display-name').innerText = user.displayName || user.email;
                fetchActiveLobbies();
            }
        });
    </script>
</body>
</html>
