<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexadune - Desert Territory Game</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #dcb37b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 2px solid #b88d54;
            pointer-events: auto;
        }

        #game-window {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #game-window:active {
            cursor: grabbing;
        }

        #map-container {
            position: absolute;
            transform-origin: 0 0;
        }

        .hex-group {
            cursor: pointer;
        }

        .hex-group:hover .hex-polygon {
            filter: brightness(1.15);
            stroke: #fff;
            stroke-width: 3;
        }

        .hex-polygon {
            stroke: #b88d54;
            stroke-width: 2;
            transition: fill 0.3s, stroke 0.2s, stroke-width 0.2s;
        }

        /* Base Terrain Colors */
        .terrain-sand { fill: url(#sand-pattern); }
        .terrain-cactus { fill: url(#cactus-pattern); }
        .terrain-tower { fill: #e8cc9b; stroke: #8a6a3d; stroke-width: 4; }

        /* Ownership Overlays via CSS Variables (assigned via JS) */
        .owned-p1 { fill: #ff4d4d !important; fill-opacity: 0.7; }
        .owned-p2 { fill: #3399ff !important; fill-opacity: 0.7; }
        .owned-p3 { fill: #00cc66 !important; fill-opacity: 0.7; }

        .hex-text {
            font-size: 24px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }

        .player-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
        }
        .p1-bg { background-color: #ff4d4d; }
        .p2-bg { background-color: #3399ff; }
        .p3-bg { background-color: #00cc66; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="panel">
            <h2 style="margin: 0 0 5px 0; color: #5c4322;">Hexadune</h2>
            <p style="margin: 0 0 5px 0; color: #7f6443; font-weight: bold; font-size: 0.9em;" id="game-id-display"></p>
            <p style="margin: 0 0 10px 0; font-size: 0.9em;" id="player-id-display"></p>
            
            <div id="turn-indicator" style="margin-bottom: 10px; font-weight: bold; font-size: 1.1em;">Loading game state...</div>
            
            <p style="margin: 0; color: #333; font-size: 0.85em;">
                Drag to pan | Scroll to zoom<br>
                Click adjacent cells to expand your territory!
            </p>
            <p id="status-log" style="margin-top: 10px; font-size: 0.9em; color: #d35400; font-weight: bold;"></p>
        </div>
        
        <div class="panel" id="leaderboard" style="font-size: 0.9em;">
            <h3 style="margin: 0 0 5px 0; color: #5c4322;">Territory Control</h3>
            <div id="leaderboard-scores"></div>
        </div>
    </div>

    <div id="game-window">
        <div id="map-container">
            <svg id="hex-grid" style="overflow: visible;">
                <defs>
                    <pattern id="sand-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                        <rect width="40" height="40" fill="#e1c699" />
                        <circle cx="10" cy="10" r="1" fill="#cba974" />
                        <circle cx="30" cy="25" r="1.5" fill="#cba974" />
                        <circle cx="20" cy="5" r="1" fill="#cba974" />
                        <circle cx="5" cy="35" r="1" fill="#f0dcae" />
                    </pattern>
                    <pattern id="cactus-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                        <rect width="40" height="40" fill="#d2b48c" />
                        <circle cx="15" cy="15" r="2" fill="#2e8b57" />
                    </pattern>
                </defs>
            </svg>
        </div>
    </div>

   <script>
        // --- 1. CONFIGURATION & STATE ---
        const HEX_SIZE = 45;
        const MAP_RADIUS = 9;
        const HEX_WIDTH = Math.sqrt(3) * HEX_SIZE;
        const HEX_HEIGHT = 2 * HEX_SIZE;
        
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:3000/v1' 
            : 'https://hexadune.onrender.com/v1';

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('gameId') || 'dune-lobby-standard';
        
        let playerId = localStorage.getItem('hexadune_player_id');
        if (!playerId) {
            playerId = 'player-' + Math.random().toString(36).substring(2, 7);
            localStorage.setItem('hexadune_player_id', playerId);
        }

        document.getElementById('game-id-display').innerText = `Game ID: ${gameId}`;
        document.getElementById('player-id-display').innerHTML = `You: <span id="local-badge" class="player-badge">${playerId}</span>`;

        let localPlayerColorClass = '';
        let tileElements = {}; 
        let mapData = {};      

        // --- 2. DETERMINISTIC MAP GENERATION ENGINE ---
        function getDeterministicTerrain(q, r) {
            let seedOffset = 0;
            for (let i = 0; i < gameId.length; i++) {
                seedOffset += gameId.charCodeAt(i) * (i + 1);
            }

            let dot1 = (q * 12.9898) + (r * 78.233) + (seedOffset * 0.123);
            let dot2 = (q * 45.1312) + (r * 23.7198) - (seedOffset * 0.456);
            
            let hash = Math.sin(dot1) * Math.cos(dot2) * 43758.5453123;
            const rand = hash - Math.floor(hash);

            if (rand < 0.08) return 'tower';
            if (rand < 0.20) return 'cactus';
            return 'sand';
        }

        // --- 3. RENDER HEX GRID ---
        const svgGrid = document.getElementById('hex-grid');
        const hexPoints = [];
        for (let i = 0; i < 6; i++) {
            const angle_rad = Math.PI / 180 * (60 * i - 30);
            hexPoints.push(`${HEX_SIZE * Math.cos(angle_rad)},${HEX_SIZE * Math.sin(angle_rad)}`);
        }
        const polygonPoints = hexPoints.join(' ');

        function buildVisualGrid() {
            // CRITICAL FIX: Clear out any old lingering SVG rendering structures to drop ghost islands
            const defs = svgGrid.querySelector('defs');
            svgGrid.innerHTML = '';
            if (defs) svgGrid.appendChild(defs);
            tileElements = {};

            Object.keys(mapData).forEach(key => {
                const [q, r] = key.split(',').map(Number);
                const x = HEX_SIZE * Math.sqrt(3) * (q + r / 2);
                const y = HEX_SIZE * 3 / 2 * r;
                const cell = mapData[key];

                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.classList.add('hex-group');
                group.setAttribute('transform', `translate(${x}, ${y})`);

                group.addEventListener('click', () => {
                    if (isDraggingMap) return;
                    handleHexClick(q, r, cell.type);
                });

                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygon.setAttribute('points', polygonPoints);
                polygon.classList.add('hex-polygon', `terrain-${cell.type}`);
                group.appendChild(polygon);

                if (cell.type === 'cactus') {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.textContent = '🌵';
                    text.classList.add('hex-text');
                    group.appendChild(text);
                } else if (cell.type === 'tower') {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.textContent = '🗼';
                    text.classList.add('hex-text');
                    group.appendChild(text);
                }

                svgGrid.appendChild(group);
                tileElements[key] = polygon;
            });
        }

        // --- 4. NETWORK SYNC & GAMEPLAY ACTION ---
        async function handleHexClick(q, r, type) {
            const actionType = type === 'tower' ? 'CONQUER_TOWER' : 'MOVE';
            logStatus(`Sending movement: ${actionType} to [${q},${r}]...`);

            try {
                const response = await fetch(`${API_URL}/actions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId, playerId, action: actionType, targetCoords: { q, r } }),
                });
                const data = await response.json();
                
                if(!data.success) {
                    logStatus(`🚫 Action Rejected: ${data.error}`);
                } else {
                    logStatus(`✨ Action Approved!`);
                    updateWorldState(data.gameState);
                }
            } catch (error) {
                logStatus("Error interacting with server processing.");
            }
        }

        function logStatus(msg) {
            const logger = document.getElementById('status-log');
            logger.innerText = msg;
        }

        function getPlayerClass(index) {
            if (index === 0) return 'owned-p1';
            if (index === 1) return 'owned-p2';
            return 'owned-p3';
        }

        let mapGenerated = false;
        function buildVisualGridFromServer(validTiles) {
            if (mapGenerated) return; 
            mapGenerated = true;

            mapData = {};
            Object.keys(validTiles).forEach(key => {
                const [q, r] = key.split(',').map(Number);
                const type = getDeterministicTerrain(q, r); 
                mapData[key] = { type };
            });

            buildVisualGrid(); 
        }

        function updateWorldState(state) {
            if (state.validTiles) {
                buildVisualGridFromServer(state.validTiles);
            }
            const activePlayers = state.players;
            const localIdx = activePlayers.indexOf(playerId);
            if(localIdx !== -1) {
                const badge = document.getElementById('local-badge');
                badge.className = `player-badge p${localIdx+1}-bg`;
            }

            const indicator = document.getElementById('turn-indicator');
            if(state.status === 'finished') {
                indicator.innerText = "Game Over!";
            } else {
                const currentTurnPlayer = state.turnOrder[state.currentTurnIndex];
                const isMyTurn = currentTurnPlayer === playerId;
                indicator.innerHTML = isMyTurn 
                    ? `<span style="color: #27ae60">Your Turn! Accrue Territory.</span>`
                    : `Waiting for Turn: <span class="player-badge p${activePlayers.indexOf(currentTurnPlayer)+1}-bg">${currentTurnPlayer}</span>`;
            }

            Object.values(tileElements).forEach(el => {
                el.classList.remove('owned-p1', 'owned-p2', 'owned-p3');
            });

            Object.keys(state.tileOwnership).forEach(key => {
                if (tileElements[key]) {
                    const ownerId = state.tileOwnership[key];
                    const pIdx = activePlayers.indexOf(ownerId);
                    if (pIdx !== -1) {
                        tileElements[key].classList.add(getPlayerClass(pIdx));
                    }
                }
            });

            const board = document.getElementById('leaderboard-scores');
            board.innerHTML = '';
            activePlayers.forEach((p, idx) => {
                const count = Object.values(state.tileOwnership).filter(id => id === p).length;
                board.innerHTML += `
                    <div style="margin: 4px 0; display:flex; justify-content:space-between; align-items:center;">
                        <span class="player-badge p${idx+1}-bg">${p}</span>
                        <span style="font-weight:bold;">${count} hexes</span>
                    </div>`;
            });
        }

        async function fetchStateUpdate() {
            try {
                const response = await fetch(`${API_URL}/games/${gameId}`);
                const data = await response.json();
                if (data.success) {
                    updateWorldState(data.gameState);
                }
            } catch (err) {
                console.error("Polling sync anomaly:", err);
            }
        }

        // CRITICAL FIX: Do not build an unverified grid on start. 
        // Let fetchStateUpdate receive the server's clean validTiles object configuration first!
        fetchStateUpdate();
        setInterval(fetchStateUpdate, 500);

        // --- 5. CAMERA PAN & ZOOM LOGIC ---
        const gameWindow = document.getElementById('game-window');
        const mapContainer = document.getElementById('map-container');
        let isPointerDown = false, isDraggingMap = false, startX, startY;
        let currentTranslateX = window.innerWidth / 2, currentTranslateY = window.innerHeight / 2, currentScale = 1.0;

        function updateTransform() {
            mapContainer.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px) scale(${currentScale})`;
        }
        updateTransform();

        gameWindow.addEventListener('mousedown', (e) => {
            isPointerDown = true;
            isDraggingMap = false;
            startX = e.clientX - currentTranslateX;
            startY = e.clientY - currentTranslateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPointerDown) return;
            if (!isDraggingMap && (Math.abs(e.clientX - currentTranslateX - startX) > 3 || Math.abs(e.clientY - currentTranslateY - startY) > 3)) {
                isDraggingMap = true;
            }
            if (isDraggingMap) {
                currentTranslateX = e.clientX - startX;
                currentTranslateY = e.clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isPointerDown = false;
            setTimeout(() => isDraggingMap = false, 50);
        });

        gameWindow.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomDirection = e.deltaY < 0 ? 1 : -1;
            const newScale = Math.min(Math.max(0.3, currentScale + (zoomDirection * 0.1)), 3.0);
            const ratio = newScale / currentScale;
            currentTranslateX = e.clientX - (e.clientX - currentTranslateX) * ratio;
            currentTranslateY = e.clientY - (e.clientY - currentTranslateY) * ratio;
            currentScale = newScale;
            updateTransform();
        }, { passive: false });
    </script>
</body>
</html>
